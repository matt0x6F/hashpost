# Development configuration for HashPost

# PDS Configuration
pds:
  server:
    host: "0.0.0.0"
    port: 8080
    dev: true
  database:
    host: "localhost"
    port: 5432
    database: "hashpost_pds_dev"
    username: "hashpost_pds"
    password: "password"
    ssl_mode: "disable"
  redis:
    url: "redis://redis:6379"
  nats:
    url: "nats://nats:4222"
  atproto:
    did_resolver: "https://plc.directory"
    handle_base: "hashpost-pds"
  # External PDS Support
  external_support:
    enabled: true
    token_cache_ttl: "1h"
    public_key_cache_ttl: "24h"
  # OAuth Configuration
  oauth:
    client_name: "HashPost"
    redirect_uris:
      - "http://localhost:3000/auth/callback"

# AppView Configuration  
appview:
  server:
    host: "0.0.0.0"
    port: 8081
    dev: true
  database:
    host: "localhost"
    port: 5432
    database: "hashpost_appview_dev"
    username: "hashpost_appview"
    password: "password"
    ssl_mode: "disable"
  pds:
    url: "http://localhost:8080"

# Logging
logging:
  level: "debug"
  format: "json"
