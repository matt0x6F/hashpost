apiVersion: v1
kind: ConfigMap
metadata:
  name: hashpost-config
data:
  # Database configuration - Managed PostgreSQL cluster
  DB_HOST: "hashpost-postgres-cluster"
  DB_PORT: "5432"
  DB_NAME: "hashpost"
  DB_SSLMODE: "require"
  
  # Application environment
  ENV: "production"
  
  # Server configuration
  SERVER_SITE_URL: "https://testing.hashpost.dev"
  
  # Migration configuration
  MIGRATIONS_DIR: "/app/internal/database/migrations"

  JWT_DEVELOPMENT: "false"
  
  # CORS configuration
  CORS_ALLOWED_ORIGINS: "https://testing.hashpost.dev"  # Update this for production
  CORS_ALLOWED_METHODS: "GET,POST,PUT,DELETE,OPTIONS,PATCH"
  CORS_ALLOWED_HEADERS: "Content-Type,Authorization,X-Requested-With,Accept,Origin"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_MAX_AGE: "86400"
  
  # IBE system configuration
  IBE_DOMAIN_KEYS_DIR: "/app/keys/domains"
  IBE_KEY_VERSION: "1"
  IBE_SALT: "hashpost_fingerprint_salt_v1"
  IBE_KEY_ROTATION_ENABLED: "false"
  IBE_KEY_ROTATION_INTERVAL: "8760h"
  IBE_KEY_ROTATION_GRACE_PERIOD: "720h"
  
  # Email configuration
  EMAIL_PROVIDER: "mailgun"
  EMAIL_FROM_ADDRESS: "noreply@hashpost.dev"
  EMAIL_FROM_NAME: "HashPost"
  
  # Mailgun configuration
  MAILGUN_DOMAIN: "hashpost.dev"
  MAILGUN_BASE_URL: "https://api.mailgun.net"
  MAILGUN_REGION: "us"
  
  # Email validation configuration
  EMAIL_VALIDATION_ENABLED: "true"
  EMAIL_VALIDATION_VERIFIER_EMAIL: "noreply@hashpost.dev"
  EMAIL_VALIDATION_VERIFIER_SMTP_USER: "noreply@hashpost.dev"
  EMAIL_VALIDATION_SMTP_HOST: "smtp.mailgun.org"
  EMAIL_VALIDATION_SMTP_PORT: "587"
  EMAIL_VALIDATION_CONNECTION_TIMEOUT: "5"
  EMAIL_VALIDATION_RESPONSE_TIMEOUT: "2"
  EMAIL_VALIDATION_SMTP_FAIL_FAST: "true"
  EMAIL_VALIDATION_SMTP_SAFE_CHECK: "true"
  EMAIL_VALIDATION_LEVEL: "smtp"
  
