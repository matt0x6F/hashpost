apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - postgres-cluster.yaml
  - postgres-init-configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - api-stripprefix-middleware.yaml
  - ingress.yaml
  - configmap.yaml

labels:
  - pairs:
      app: hashpost
      version: v1

configMapGenerator:
  - name: hashpost-config
    literals:
      # Database configuration - Crunchy Data PostgreSQL cluster
      - DB_HOST=hashpost-postgres-cluster-primary
      - DB_PORT=5432
      - DB_NAME=hashpost
      - DB_SSLMODE=require
      # Application environment
      - ENV=production
      # Migration configuration
      - MIGRATIONS_DIR=/app/internal/database/migrations
      - JWT_DEVELOPMENT=false
      # CORS configuration
      - CORS_ALLOWED_ORIGINS=https://hashpost.dev
      - CORS_ALLOWED_METHODS=GET,POST,PUT,DELETE,OPTIONS,PATCH
      - CORS_ALLOWED_HEADERS=Content-Type,Authorization,X-Requested-With,Accept,Origin
      - CORS_ALLOW_CREDENTIALS=true
      - CORS_MAX_AGE=86400
      # IBE system configuration
      - IBE_DOMAIN_KEYS_DIR=/app/keys/domains
      - IBE_KEY_VERSION=1
      - IBE_SALT=hashpost_fingerprint_salt_v1
      - IBE_KEY_ROTATION_ENABLED=false
      - IBE_KEY_ROTATION_INTERVAL=8760h
      - IBE_KEY_ROTATION_GRACE_PERIOD=720h

images:
  - name: hashpost-backend
    newTag: latest
  - name: hashpost-frontend
    newTag: latest
