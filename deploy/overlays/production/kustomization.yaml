apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: hashpost-production

resources:
  - ../../base

nameSuffix: -production

labels:
  - pairs:
      environment: production

patches:
  - target:
      kind: Deployment
      name: hashpost-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
  - target:
      kind: Deployment
      name: hashpost-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 200m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 400m
  - target:
      kind: Deployment
      name: postgres
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 512Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 1Gi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1000m
  - target:
      kind: PersistentVolumeClaim
      name: postgres-pvc
    patch: |-
      - op: replace
        path: /spec/resources/requests/storage
        value: 50Gi
  - target:
      kind: Ingress
      name: hashpost-ingress
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: hashpost.dev
      - op: replace
        path: /spec/tls/0/hosts/0
        value: hashpost.dev
  - target:
      kind: Deployment
      name: hashpost-backend
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: hashpost-backend
      spec:
        template:
          spec:
            containers:
            - name: hashpost-backend
              env:
              - name: MAILGUN_SENDING_API_KEY
                valueFrom:
                  secretKeyRef:
                    name: hashpost-secrets
                    key: MAILGUN_SENDING_API_KEY

configMapGenerator:
  - name: hashpost-config
    behavior: merge
    literals:
      - ENV=production
      - CORS_ALLOWED_ORIGINS=https://hashpost.dev
      - JWT_DEVELOPMENT=false
      - EMAIL_PROVIDER=mailgun
      - EMAIL_FROM_ADDRESS=noreply@hashpost.dev
      - EMAIL_FROM_NAME=HashPost
      - MAILGUN_REGION=us
      - MAILGUN_BASE_URL=https://api.mailgun.net
      - SERVER_SITE_URL=https://hashpost.dev

images:
  - name: hashpost-backend
    newName: registry.digitalocean.com/hashpost/hashpost-backend
    newTag: latest
  - name: hashpost-frontend
    newName: registry.digitalocean.com/hashpost/hashpost-frontend
    newTag: latest
