permissions:
  contents: read
name: Deploy HashPost

on:
  push:
    branches:
      - '*'
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'ui/**'
      - 'Dockerfile'
      - 'ui/Dockerfile'
      - 'deploy/**'
      - '.github/workflows/**'
  release:
    types: [published]

env:
  REGISTRY_NAME: ${{ secrets.REGISTRY_NAME }}
  CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}
  DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

jobs:
  deploy:
    # Only deploy if tests pass (assumes there's a separate test workflow)
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Set deployment environment and tags
      id: deployment-env
      run: |
        if [[ "${{ github.event_name }}" == "release" ]]; then
          echo "environment=production" >> $GITHUB_OUTPUT
          echo "image_tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          echo "overlay=production" >> $GITHUB_OUTPUT
          echo "namespace=hashpost-production" >> $GITHUB_OUTPUT
          echo "api_url=https://hashpost.dev/api" >> $GITHUB_OUTPUT
        elif [[ "${{ github.event_name }}" == "push" ]]; then
          # Handle all branch pushes (main, feature branches, PR branches, etc.)
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=testing" >> $GITHUB_OUTPUT
            echo "image_tag=$(echo $GITHUB_SHA | head -c7)" >> $GITHUB_OUTPUT
            echo "overlay=testing" >> $GITHUB_OUTPUT
            echo "namespace=hashpost-testing" >> $GITHUB_OUTPUT
            echo "api_url=https://testing.hashpost.dev/api" >> $GITHUB_OUTPUT
          else
            # Handle non-main branch pushes (feature branches, PR branches, etc.)
            branch_name=$(echo "${{ github.ref }}" | sed 's/refs\/heads\///')
            echo "environment=branch-testing" >> $GITHUB_OUTPUT
            echo "image_tag=branch-${branch_name}-$(echo $GITHUB_SHA | head -c7)" >> $GITHUB_OUTPUT
            echo "overlay=testing" >> $GITHUB_OUTPUT
            echo "namespace=hashpost-testing" >> $GITHUB_OUTPUT
            echo "api_url=https://testing.hashpost.dev/api" >> $GITHUB_OUTPUT
          fi
        elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
          echo "environment=pr-testing" >> $GITHUB_OUTPUT
          echo "image_tag=pr-${{ github.event.number }}-$(echo $GITHUB_SHA | head -c7)" >> $GITHUB_OUTPUT
          echo "overlay=testing" >> $GITHUB_OUTPUT
          echo "namespace=hashpost-testing" >> $GITHUB_OUTPUT
          echo "api_url=https://testing.hashpost.dev/api" >> $GITHUB_OUTPUT
        else
          echo "Skipping deployment - not a push or PR event"
          exit 0
        fi

    - name: Build backend container image
      run: |
        echo "Building backend image..."
        docker build -t ${{ secrets.REGISTRY_NAME }}/hashpost-backend:${{ steps.deployment-env.outputs.image_tag }} \
          --target production . --progress=plain
        
        echo "Backend image built successfully"

    - name: Build frontend container image
      run: |
        docker build -t ${{ secrets.REGISTRY_NAME }}/hashpost-frontend:${{ steps.deployment-env.outputs.image_tag }} \
          --build-arg NEXT_PUBLIC_API_URL=${{ steps.deployment-env.outputs.api_url }} \
          --target runner ./ui

    - name: Log in to DigitalOcean Container Registry
      run: doctl registry login --expiry-seconds 1200

    - name: Push images to DigitalOcean Container Registry
      run: |
        docker push ${{ secrets.REGISTRY_NAME }}/hashpost-backend:${{ steps.deployment-env.outputs.image_tag }}
        docker push ${{ secrets.REGISTRY_NAME }}/hashpost-frontend:${{ steps.deployment-env.outputs.image_tag }}
        
        # Also push to latest tag for branch pushes (not releases)
        if [[ "${{ github.event_name }}" == "push" ]]; then
          echo "Tagging and pushing as latest..."
          docker tag ${{ secrets.REGISTRY_NAME }}/hashpost-backend:${{ steps.deployment-env.outputs.image_tag }} ${{ secrets.REGISTRY_NAME }}/hashpost-backend:latest
          docker tag ${{ secrets.REGISTRY_NAME }}/hashpost-frontend:${{ steps.deployment-env.outputs.image_tag }} ${{ secrets.REGISTRY_NAME }}/hashpost-frontend:latest
          docker push ${{ secrets.REGISTRY_NAME }}/hashpost-backend:latest
          docker push ${{ secrets.REGISTRY_NAME }}/hashpost-frontend:latest
        fi

    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    - name: Install Kustomize
      run: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/

    - name: Save DigitalOcean kubeconfig
      run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 ${{ secrets.CLUSTER_NAME }}

    - name: Create namespace if it doesn't exist
      run: |
        kubectl create namespace ${{ steps.deployment-env.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Update Kustomization with new image tags
      run: |
        cd deploy/overlays/${{ steps.deployment-env.outputs.overlay }}
        kustomize edit set image hashpost-backend=${{ secrets.REGISTRY_NAME }}/hashpost-backend:${{ steps.deployment-env.outputs.image_tag }}
        kustomize edit set image hashpost-frontend=${{ secrets.REGISTRY_NAME }}/hashpost-frontend:${{ steps.deployment-env.outputs.image_tag }}

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -k deploy/overlays/${{ steps.deployment-env.outputs.overlay }}

    - name: Verify backend deployment
      run: |
        kubectl rollout status deployment/hashpost-backend-${{ steps.deployment-env.outputs.overlay }} \
          -n ${{ steps.deployment-env.outputs.namespace }} --timeout=300s

    - name: Verify frontend deployment
      run: |
        kubectl rollout status deployment/hashpost-frontend-${{ steps.deployment-env.outputs.overlay }} \
          -n ${{ steps.deployment-env.outputs.namespace }} --timeout=300s

    - name: Get deployment status
      run: |
        echo "Deployment completed successfully!"
        echo "Environment: ${{ steps.deployment-env.outputs.environment }}"
        echo "Deployed Images (from DigitalOcean Container Registry):"
        echo "  Backend: ${{ secrets.REGISTRY_NAME }}/hashpost-backend:${{ steps.deployment-env.outputs.image_tag }}"
        echo "  Frontend: ${{ secrets.REGISTRY_NAME }}/hashpost-frontend:${{ steps.deployment-env.outputs.image_tag }}"
        
        # Get service endpoints
        kubectl get services -n ${{ steps.deployment-env.outputs.namespace }}
        kubectl get ingress -n ${{ steps.deployment-env.outputs.namespace }}

    - name: Create GitHub Deployment
      run: |
        # Create a GitHub deployment record
        deployment_url="https://api.github.com/repos/${{ github.repository }}/deployments"
        
        # Set description based on environment
        if [[ "${{ steps.deployment-env.outputs.environment }}" == "production" ]]; then
          description="Production deployment of ${{ github.event.release.tag_name }}"
          environment="production"
        elif [[ "${{ steps.deployment-env.outputs.environment }}" == "testing" ]]; then
          description="Testing deployment of main branch"
          environment="testing"
        else
          description="Branch deployment of ${{ github.ref_name }}"
          environment="testing"
        fi
        
        # Create deployment payload
        payload='{
          "ref": "${{ github.sha }}",
          "task": "deploy",
          "auto_merge": false,
          "required_contexts": [],
          "environment": "'$environment'",
          "description": "'$description'",
          "transient_environment": false
        }'
        
        # Create deployment
        response=$(curl -s -X POST \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Content-Type: application/json" \
          -d "$payload" \
          "$deployment_url")
        
        deployment_id=$(echo "$response" | jq -r '.id')
        
        if [[ "$deployment_id" != "null" && "$deployment_id" != "" ]]; then
          echo "GitHub deployment created with ID: $deployment_id"
          
          # Update deployment status to success
          status_url="https://api.github.com/repos/${{ github.repository }}/deployments/$deployment_id/statuses"
          status_payload='{
            "state": "success",
            "description": "Deployment completed successfully",
            "environment_url": "${{ steps.deployment-env.outputs.api_url }}",
            "log_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          }'
          
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Content-Type: application/json" \
            -d "$status_payload" \
            "$status_url"
          
          echo "Deployment status updated to success"
        else
          echo "Failed to create GitHub deployment"
          echo "Response: $response"
        fi


