permissions:
  contents: read
name: Deploy HashPost

on:
  push:
    branches:
      - '*'
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'ui/**'
      - 'Dockerfile'
      - 'ui/Dockerfile'
      - 'deploy/**'
      - '.github/workflows/**'
  release:
    types: [published]

env:
  REGISTRY_NAME: ${{ secrets.REGISTRY_NAME }}
  CLUSTER_NAME: ${{ secrets.CLUSTER_NAME }}
  DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

jobs:
  deploy:
    # Only deploy if tests pass (assumes there's a separate test workflow)
    if: github.event_name == 'push' || github.event_name == 'release'
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: hashpost
          POSTGRES_USER: hashpost
          POSTGRES_DB: hashpost
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4



    - name: Install doctl
      uses: digitalocean/action-doctl@v2
      with:
        token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

    - name: Set deployment environment and tags
      id: deployment-env
      run: |
        if [[ "${{ github.event_name }}" == "release" ]]; then
          echo "environment=production" >> $GITHUB_OUTPUT
          echo "image_tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          echo "overlay=production" >> $GITHUB_OUTPUT
          echo "namespace=hashpost-production" >> $GITHUB_OUTPUT
          echo "api_url=https://hashpost.dev/api" >> $GITHUB_OUTPUT
        elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == "refs/heads/main" ]]; then
          echo "environment=testing" >> $GITHUB_OUTPUT
          echo "image_tag=$(echo $GITHUB_SHA | head -c7)" >> $GITHUB_OUTPUT
          echo "overlay=testing" >> $GITHUB_OUTPUT
          echo "namespace=hashpost-testing" >> $GITHUB_OUTPUT
          echo "api_url=https://testing.hashpost.dev/api" >> $GITHUB_OUTPUT
        else
          echo "Skipping deployment - not a main branch push or release"
          exit 0
        fi

    - name: Build backend container image
      run: |
        echo "Building backend image..."
        echo "Current directory: $(pwd)"
        echo "Directory contents:"
        ls -la
        
        echo "Building hashpost-backend:latest..."
        # Build backend image for both the service and registry
        docker build -t hashpost-backend:latest --target production . --progress=plain
        
        echo "Building registry image..."
        docker build -t ${{ secrets.REGISTRY_NAME }}/hashpost-backend:${{ steps.deployment-env.outputs.image_tag }} \
          --target production . --progress=plain
        
        echo "Backend image built successfully"

    - name: Generate IBE keys for CI
      run: |
        echo "Generating IBE keys for CI environment..."
        # Create a temporary container to generate IBE keys
        docker run --rm -v $(pwd)/tmp-keys:/app/keys hashpost-backend:latest \
          ./main generate-ibe-keys --output-dir /app/keys --generate-new --non-interactive
        
        echo "IBE keys generated successfully"

    - name: Start HashPost service
      run: |
        echo "Starting HashPost service..."
        # Start HashPost service in background
        docker run -d --name hashpost-service \
          --network host \
          -e DATABASE_HOST=localhost \
          -e DATABASE_PORT=5432 \
          -e DATABASE_USER=hashpost \
          -e DATABASE_PASSWORD=hashpost \
          -e DATABASE_DATABASE=hashpost \
          -e JWT_SECRET=temp-secret-for-openapi \
          -e IBE_DOMAIN_KEYS_DIR=/app/keys \
          -e IBE_KEY_VERSION=1 \
          -e IBE_SALT=temp-salt \
          -e SERVER_PORT=8888 \
          -e SERVER_HOST=0.0.0.0 \
          -v $(pwd)/tmp-keys:/app/keys \
          -p 8888:8888 \
          hashpost-backend:latest
        
        echo "HashPost service started"

    - name: Wait for services to be ready
      run: |
        echo "Waiting for HashPost server to be healthy..."
        timeout 60 bash -c 'until curl -f http://localhost:8888/health; do sleep 2; done'
        echo "HashPost server is ready!"

    - name: Download OpenAPI spec from service
      run: |
        echo "Downloading OpenAPI spec from HashPost service..."
        if ! curl -f -s http://localhost:8888/ > ./ui/openapi.json; then
          echo "Error: Failed to download OpenAPI spec from service"
          exit 1
        fi
        
        # Verify OpenAPI spec was generated
        if [ ! -s ./ui/openapi.json ]; then
          echo "Error: OpenAPI spec is empty or missing"
          exit 1
        fi
        
        echo "OpenAPI spec downloaded successfully"
        echo "Spec size: $(wc -c < ./ui/openapi.json) bytes"

    - name: Build frontend container image
      run: |
        docker build -t ${{ secrets.REGISTRY_NAME }}/hashpost-frontend:${{ steps.deployment-env.outputs.image_tag }} \
          --build-arg NEXT_PUBLIC_API_URL=${{ steps.deployment-env.outputs.api_url }} \
          --target runner ./ui

    - name: Log in to DigitalOcean Container Registry
      run: doctl registry login --expiry-seconds 1200

    - name: Push images to DigitalOcean Container Registry
      run: |
        docker push ${{ secrets.REGISTRY_NAME }}/hashpost-backend:${{ steps.deployment-env.outputs.image_tag }}
        docker push ${{ secrets.REGISTRY_NAME }}/hashpost-frontend:${{ steps.deployment-env.outputs.image_tag }}

    - name: Install kubectl
      uses: azure/setup-kubectl@v4
      with:
        version: 'v1.28.0'

    - name: Install Kustomize
      run: |
        curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
        sudo mv kustomize /usr/local/bin/

    - name: Save DigitalOcean kubeconfig
      run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 ${{ secrets.CLUSTER_NAME }}

    - name: Create namespace if it doesn't exist
      run: |
        kubectl create namespace ${{ steps.deployment-env.outputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -

    - name: Update Kustomization with new image tags
      run: |
        cd deploy/overlays/${{ steps.deployment-env.outputs.overlay }}
        kustomize edit set image hashpost-backend=${{ secrets.REGISTRY_NAME }}/hashpost-backend:${{ steps.deployment-env.outputs.image_tag }}
        kustomize edit set image hashpost-frontend=${{ secrets.REGISTRY_NAME }}/hashpost-frontend:${{ steps.deployment-env.outputs.image_tag }}

    - name: Deploy to Kubernetes
      run: |
        kubectl apply -k deploy/overlays/${{ steps.deployment-env.outputs.overlay }}

    - name: Verify backend deployment
      run: |
        kubectl rollout status deployment/hashpost-backend-${{ steps.deployment-env.outputs.overlay }} \
          -n ${{ steps.deployment-env.outputs.namespace }} --timeout=300s

    - name: Verify frontend deployment
      run: |
        kubectl rollout status deployment/hashpost-frontend-${{ steps.deployment-env.outputs.overlay }} \
          -n ${{ steps.deployment-env.outputs.namespace }} --timeout=300s

    - name: Get deployment status
      run: |
        echo "Deployment completed successfully!"
        echo "Environment: ${{ steps.deployment-env.outputs.environment }}"
        echo "Deployed Images (from DigitalOcean Container Registry):"
        echo "  Backend: ${{ secrets.REGISTRY_NAME }}/hashpost-backend:${{ steps.deployment-env.outputs.image_tag }}"
        echo "  Frontend: ${{ secrets.REGISTRY_NAME }}/hashpost-frontend:${{ steps.deployment-env.outputs.image_tag }}"
        
        # Get service endpoints
        kubectl get services -n ${{ steps.deployment-env.outputs.namespace }}
        kubectl get ingress -n ${{ steps.deployment-env.outputs.namespace }}

    - name: Cleanup HashPost service
      if: always()
      run: |
        echo "Cleaning up HashPost service..."
        docker stop hashpost-service || true
        docker rm hashpost-service || true
        echo "Cleanup completed"
