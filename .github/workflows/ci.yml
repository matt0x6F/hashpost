name: CI
permissions:
  contents: read

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.3'
          cache: true
      - name: Build application
        run: make build

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json
      - name: Install dependencies
        run: cd ui && npm ci
      - name: Generate API client
        run: cd ui && npm run generate-api
      - name: Type check
        run: cd ui && npm run type-check
      - name: Lint
        run: cd ui && npm run lint
      - name: Build frontend
        run: cd ui && npm run build

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.3'
          cache: true
      - name: Run unit tests
        run: make test

  dao-integration-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: hashpost_test
          POSTGRES_USER: hashpost
          POSTGRES_DB: hashpost_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.3'
          cache: true
      - name: Install sql-migrate
        run: go install github.com/rubenv/sql-migrate/...@latest
      - name: Run DAO integration tests
        run: make test-dao-ci

 