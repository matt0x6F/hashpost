components:
  schemas:
    # Authentication schemas
    UserLoginResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - handle
        - did
        - email
      properties:
        accessToken:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: JWT refresh token
        handle:
          type: string
          description: User's handle
        did:
          type: string
          description: User's DID
        email:
          type: string
          format: email
          description: User's email address

    UserRegistrationResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - handle
        - did
        - email
      properties:
        accessToken:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: JWT refresh token
        handle:
          type: string
          description: User's handle
        did:
          type: string
          description: User's DID
        email:
          type: string
          format: email
          description: User's email address

    UserSession:
      type: object
      required:
        - handle
        - did
        - email
      properties:
        handle:
          type: string
          description: User's handle
        did:
          type: string
          description: User's DID
        email:
          type: string
          format: email
          description: User's email address

    Subforum:
      type: object
      required:
        - id
        - name
        - slug
        - created_by
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the subforum
        name:
          type: string
          maxLength: 100
          description: Display name of the subforum
        slug:
          type: string
          maxLength: 50
          pattern: '^[a-z0-9-]+$'
          description: URL-friendly identifier for the subforum
        description:
          type: string
          maxLength: 500
          description: Description of the subforum
        created_by:
          type: string
          format: uuid
          description: ID of the user who created the subforum
        created_at:
          type: string
          format: date-time
          description: When the subforum was created
        updated_at:
          type: string
          format: date-time
          description: When the subforum was last updated
        subscriber_count:
          type: integer
          minimum: 0
          description: Number of subscribers to the subforum
        post_count:
          type: integer
          minimum: 0
          description: Number of posts in the subforum
        comment_count:
          type: integer
          minimum: 0
          description: Number of comments in the subforum
        prefix_type:
          type: string
          enum: ["h", "r", "t"]
          description: Subforum prefix type (h=HashPost, r=regional, t=topical)

    Post:
      type: object
      required:
        - id
        - author
        - subforum
        - title
        - content
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the post (atproto record URI)
        author:
          type: string
          format: uuid
          description: DID of the user who created the post
        subforum:
          type: string
          format: uuid
          description: ID of the subforum this post belongs to
        title:
          type: string
          maxLength: 200
          description: Title of the post
        content:
          type: string
          maxLength: 10000
          description: Content of the post
        created_at:
          type: string
          format: date-time
          description: When the post was created
        updated_at:
          type: string
          format: date-time
          description: When the post was last updated

    # Computed data schemas (not stored in post records)
    PostMetrics:
      type: object
      required:
        - upvotes
        - downvotes
        - score
        - comment_count
      properties:
        upvotes:
          type: integer
          minimum: 0
          description: Number of upvotes (computed from vote records)
        downvotes:
          type: integer
          minimum: 0
          description: Number of downvotes (computed from vote records)
        score:
          type: integer
          description: Net score (upvotes - downvotes)
        comment_count:
          type: integer
          minimum: 0
          description: Number of comments (computed from comment records)

    UserVote:
      type: object
      required:
        - vote_type
      properties:
        vote_type:
          type: string
          enum: [up, down, null]
          description: User's current vote on this post (null if no vote)

    ModerationState:
      type: object
      required:
        - is_pinned
        - is_locked
        - is_removed
      properties:
        is_pinned:
          type: boolean
          description: Whether the post is pinned
        is_locked:
          type: boolean
          description: Whether the post is locked
        is_removed:
          type: boolean
          description: Whether the post is removed by moderation

    VoteRecord:
      type: object
      required:
        - id
        - voter
        - target
        - vote_type
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the vote record (atproto record URI)
        voter:
          type: string
          format: uuid
          description: DID of the user who voted
        target:
          type: string
          format: uuid
          description: ID of the post or comment being voted on
        vote_type:
          type: string
          enum: [up, down]
          description: Type of vote
        created_at:
          type: string
          format: date-time
          description: When the vote was created

    Comment:
      type: object
      required:
        - id
        - author
        - post
        - content
        - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier for the comment
        author:
          type: string
          format: uuid
          description: ID of the user who created the comment
        post:
          type: string
          format: uuid
          description: ID of the post this comment belongs to
        parent:
          type: string
          format: uuid
          description: ID of the parent comment (for nested comments)
        content:
          type: string
          maxLength: 2000
          description: Content of the comment
        created_at:
          type: string
          format: date-time
          description: When the comment was created
        updated_at:
          type: string
          format: date-time
          description: When the comment was last updated
        upvotes:
          type: integer
          minimum: 0
          description: Number of upvotes
        downvotes:
          type: integer
          minimum: 0
          description: Number of downvotes
        reply_count:
          type: integer
          minimum: 0
          description: Number of replies

    # Vote schemas
    VoteResponse:
      type: object
      required:
        - vote_type
        - upvotes
        - downvotes
        - score
      properties:
        vote_type:
          type: string
          enum: [up, down, ""]
          description: Type of vote (empty string if no vote)
        upvotes:
          type: integer
          minimum: 0
          description: Number of upvotes
        downvotes:
          type: integer
          minimum: 0
          description: Number of downvotes
        score:
          type: integer
          description: Net score (upvotes - downvotes)

    # Subscription schemas
    SubscriptionResponse:
      type: object
      required:
        - subforum_slug
        - subscribed_at
      properties:
        subforum_slug:
          type: string
          description: Subforum slug
        subforum_name:
          type: string
          description: Subforum name
        subscribed_at:
          type: string
          format: date-time
          description: When the user subscribed

    SubscriptionListResponse:
      type: object
      required:
        - subscriptions
        - total
        - limit
        - offset
      properties:
        subscriptions:
          type: array
          items:
            $ref: '#/components/schemas/SubscriptionResponse'
        total:
          type: integer
          minimum: 0
          description: Total number of subscriptions
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of subscriptions returned
        offset:
          type: integer
          minimum: 0
          description: Number of subscriptions skipped

    SubscriberListResponse:
      type: object
      required:
        - subscribers
        - total
        - limit
        - offset
      properties:
        subscribers:
          type: array
          items:
            type: object
            required:
              - user_did
              - user_handle
              - subscribed_at
            properties:
              user_did:
                type: string
                description: User's DID
              user_handle:
                type: string
                description: User's handle
              subscribed_at:
                type: string
                format: date-time
                description: When the user subscribed
        total:
          type: integer
          minimum: 0
          description: Total number of subscribers
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Number of subscribers returned
        offset:
          type: integer
          minimum: 0
          description: Number of subscribers skipped

    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: object
          description: Additional error details

    # RBAC Schemas
    UserWithRoles:
      type: object
      required:
        - userDid
        - handle
        - roleCount
      properties:
        userDid:
          type: string
          description: User's DID
        handle:
          type: string
          description: User's handle
        displayName:
          type: string
          description: User's display name
        pdsSource:
          type: string
          description: PDS server endpoint where user data is stored
        isLocal:
          type: boolean
          description: Whether user is stored on HashPost PDS
        lastSeenAt:
          type: string
          format: date-time
          description: Last time user authenticated
        roleCount:
          type: integer
          description: Number of roles assigned to the user

    # PDS Management Schemas
    PDSServerStats:
      type: object
      required:
        - pdsEndpoint
        - userCount
        - activeUsers24h
      properties:
        pdsEndpoint:
          type: string
          description: PDS server endpoint URL
        userCount:
          type: integer
          description: Total number of users from this PDS
        lastActivity:
          type: string
          format: date-time
          description: Last activity timestamp
        activeUsers24h:
          type: integer
          description: Number of users active in last 24 hours

    PDSServerDetails:
      type: object
      required:
        - pdsEndpoint
        - userCount
        - activeUsers24h
        - activeUsers7d
        - activeUsers30d
      properties:
        pdsEndpoint:
          type: string
          description: PDS server endpoint URL
        userCount:
          type: integer
          description: Total number of users from this PDS
        lastActivity:
          type: string
          format: date-time
          description: Last activity timestamp
        firstUserCreated:
          type: string
          format: date-time
          description: When the first user from this PDS was created
        activeUsers24h:
          type: integer
          description: Number of users active in last 24 hours
        activeUsers7d:
          type: integer
          description: Number of users active in last 7 days
        activeUsers30d:
          type: integer
          description: Number of users active in last 30 days

    Role:
      type: object
      required:
        - id
        - name
        - is_platform_role
      properties:
        id:
          type: integer
          description: Role ID
        name:
          type: string
          description: Role name
        description:
          type: string
          description: Role description
        is_platform_role:
          type: boolean
          description: Whether this is a platform-wide role
        created_at:
          type: string
          format: date-time
          description: When the role was created

    Permission:
      type: object
      required:
        - id
        - name
        - resource_type
      properties:
        id:
          type: integer
          description: Permission ID
        name:
          type: string
          description: Permission name
        description:
          type: string
          description: Permission description
        resource_type:
          type: string
          enum: [platform, subforum, post, comment, vote]
          description: Type of resource this permission applies to
        created_at:
          type: string
          format: date-time
          description: When the permission was created

    UserRole:
      type: object
      required:
        - role_name
        - is_platform_role
      properties:
        role_name:
          type: string
          description: Name of the role
        subforum_id:
          type: string
          format: uuid
          description: Subforum ID for subforum-specific roles
        subforum_slug:
          type: string
          description: Subforum slug
        subforum_name:
          type: string
          description: Subforum name
        is_platform_role:
          type: boolean
          description: Whether this is a platform-wide role
        expires_at:
          type: string
          format: date-time
          description: When the role assignment expires

    UserContext:
      type: object
      required:
        - did
        - handle
        - roles
        - is_active
      properties:
        did:
          type: string
          description: User's DID
        handle:
          type: string
          description: User's handle
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
          description: User's role assignments
        is_active:
          type: boolean
          description: Whether the user is active

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT token from PDS authentication

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Subforums
    description: Subforum management and listing
  - name: Posts
    description: Post management and listing
  - name: Comments
    description: Comment management and listing
  - name: Subforum Management
    description: Subforum-level role and member management
  - name: User Management
    description: User self-management of roles and permissions
  - name: Platform Admin
    description: Platform-wide administration (global admin only)
  - name: PDS Management
    description: PDS server management and monitoring
