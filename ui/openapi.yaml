        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SwitchPseudonymResponseBody"
          description: OK
          headers:
            Domain:
              schema:
                type: string
            Expires:
              schema:
                type: string
            HttpOnly:
              schema:
                type: boolean
            MaxAge:
              schema:
                format: int64
                type: integer
            Name:
              schema:
                type: string
            Partitioned:
              schema:
                type: boolean
            Path:
              schema:
                type: string
            Quoted:
              schema:
                type: boolean
            Raw:
              schema:
                type: string
            RawExpires:
              schema:
                type: string
            SameSite:
              schema:
                format: int64
