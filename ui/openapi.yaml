openapi: 3.0.3
info:
  title: HashPost AppView API
  description: HashPost AppView provides a unified API for accessing HashPost data aggregated from the PDS
  version: 1.0.0
  contact:
    name: HashPost Team
    email: team@hashpost.com

servers:
  - url: http://localhost:8081
    description: Development server
  - url: https://appview.hashpost.com
    description: Production server

paths:
  # Authentication endpoints
  /api/v1/auth/login:
    post:
      summary: Login user
      description: Authenticate user with email/password
      operationId: loginUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                password:
                  type: string
                  description: User's password
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserLoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/register:
    post:
      summary: Register user
      description: Create a new user account
      operationId: registerUser
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - handle
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                password:
                  type: string
                  description: User's password
                handle:
                  type: string
                  description: User's handle
                inviteCode:
                  type: string
                  description: Optional invite code
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRegistrationResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Handle already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/me:
    get:
      summary: Get current user session
      description: Get information about the currently authenticated user
      operationId: getCurrentUserSession
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User session information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSession'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      summary: Logout user
      description: Logout the current user session
      operationId: logoutUser
      tags:
        - Authentication
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Logged out successfully"
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/subforums:
    get:
      summary: List subforums
      description: Get a list of all subforums
      operationId: listSubforums
      tags:
        - Subforums
      parameters:
        - name: limit
          in: query
          description: Maximum number of subforums to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of subforums to skip
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of subforums
          content:
            application/json:
              schema:
                type: object
                properties:
                  subforums:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subforum'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create subforum
      description: Create a new subforum (requires authentication)
      operationId: createSubforum
      tags:
        - Subforums
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - slug
                - prefix_type
              properties:
                name:
                  type: string
                  description: Name of the subforum
                  minLength: 1
                  maxLength: 255
                  example: "Technology Discussion"
                slug:
                  type: string
                  description: URL-friendly slug for the subforum (without prefix)
                  minLength: 1
                  maxLength: 255
                  pattern: '^[a-z0-9-]+$'
                  example: "technology"
                description:
                  type: string
                  description: Optional description of the subforum
                  maxLength: 1000
                  example: "A place to discuss all things tech"
                prefix_type:
                  type: string
                  description: Subforum prefix type
                  enum: ["h", "r", "t"]
                  example: "t"
      responses:
        '201':
          description: Subforum created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subforum'
        '400':
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/subforums/{slug}:
    get:
      summary: Get subforum by slug
      description: Get a specific subforum by its slug
      operationId: getSubforumBySlug
      tags:
        - Subforums
      parameters:
        - name: slug
          in: path
          required: true
          description: The subforum slug
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
      responses:
        '200':
          description: Subforum details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subforum'
        '404':
          description: Subforum not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/posts:
    get:
      summary: List posts
      description: Get a list of posts, optionally filtered by subforum
      operationId: listPosts
      tags:
        - Posts
      parameters:
        - name: subforum
          in: query
          description: Filter posts by subforum slug
          required: false
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of posts to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of posts to skip
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                type: object
                properties:
                  posts:
                    type: array
                    items:
                      $ref: '#/components/schemas/Post'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      summary: Create a new post
      description: Create a new post in a subforum
      operationId: createPost
      tags:
        - Posts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
                - subforum_slug
              properties:
                title:
                  type: string
                  maxLength: 200
                  description: Title of the post
                content:
                  type: string
                  maxLength: 10000
                  description: Content of the post
                subforum_slug:
                  type: string
                  description: Slug of the subforum to post in
      responses:
        '201':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/posts/{id}:
    get:
      summary: Get post by ID
      description: Get a specific post by its ID
      operationId: getPostByID
      tags:
        - Posts
      parameters:
        - name: id
          in: path
          required: true
          description: The post ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Update a post
      description: Update an existing post
      operationId: updatePost
      tags:
        - Posts
      parameters:
        - name: id
          in: path
          required: true
          description: The post ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - content
              properties:
                title:
                  type: string
                  maxLength: 200
                  description: Title of the post
                content:
                  type: string
                  maxLength: 10000
                  description: Content of the post
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Delete a post
      description: Delete an existing post
      operationId: deletePost
      tags:
        - Posts
      parameters:
        - name: id
          in: path
          required: true
          description: The post ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Post deleted successfully
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/comments:
    get:
      summary: List comments
      description: Get a list of comments for a specific post
      operationId: listComments
      tags:
        - Comments
      parameters:
        - name: post_id
          in: query
          description: Filter comments by post ID
          required: true
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: Maximum number of comments to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of comments to skip
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of comments
          content:
            application/json:
              schema:
                type: object
                properties:
                  comments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Subforum RBAC Management Endpoints
  /api/v1/subforums/{slug}/members:
    get:
      summary: List subforum members
      description: Get a list of members with their roles in a specific subforum
      operationId: listSubforumMembers
      tags:
        - Subforum Management
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The subforum slug
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
        - name: limit
          in: query
          description: Maximum number of members to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of members to skip
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of subforum members with roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserWithRoles'
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions (must be subforum owner or moderator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Subforum not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/subforums/{slug}/members/{user_did}/roles:
    post:
      summary: Assign role to subforum member
      description: Assign a role to a user in a specific subforum (subforum owner/moderator only)
      operationId: assignSubforumRole
      tags:
        - Subforum Management
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The subforum slug
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
        - name: user_did
          in: path
          required: true
          description: The user's DID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role_name
              properties:
                role_name:
                  type: string
                  description: Name of the role to assign
                expires_at:
                  type: string
                  format: date-time
                  description: When the role assignment expires (optional)
      responses:
        '200':
          description: Role assigned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Role assigned successfully"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions (must be subforum owner or moderator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Subforum or user not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Revoke role from subforum member
      description: Revoke a role from a user in a specific subforum (subforum owner/moderator only)
      operationId: revokeSubforumRole
      tags:
        - Subforum Management
      security:
        - bearerAuth: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The subforum slug
          schema:
            type: string
            pattern: '^[a-z0-9-]+$'
        - name: user_did
          in: path
          required: true
          description: The user's DID
          schema:
            type: string
        - name: role_name
          in: query
          required: true
          description: Name of the role to revoke
          schema:
            type: string
      responses:
        '200':
          description: Role revoked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Role revoked successfully"
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions (must be subforum owner or moderator)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Subforum, user, or role not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # User Self-Management Endpoints
  /api/v1/me/roles:
    get:
      summary: Get my roles
      description: Get all roles assigned to the authenticated user
      operationId: getMyRoles
      tags:
        - User Management
      security:
        - bearerAuth: []
      parameters:
        - name: subforum_id
          in: query
          description: Filter roles by subforum ID
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User's roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserRole'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/me/permissions:
    get:
      summary: Check my permissions
      description: Check what permissions the authenticated user has
      operationId: getMyPermissions
      tags:
        - User Management
      security:
        - bearerAuth: []
      parameters:
        - name: subforum_id
          in: query
          description: Check permissions for a specific subforum
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User's permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      type: string
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Platform Admin Endpoints (Global Management)
  /api/v1/admin/users:
    get:
      summary: List all users across platform
      description: Get a list of all users with their role assignments (platform admin only)
      operationId: listAllUsers
      tags:
        - Platform Admin
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Maximum number of users to return
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          description: Number of users to skip
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of all users with roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserWithRoles'
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/roles:
    get:
      summary: List all roles
      description: Get a list of all available roles (platform admin only)
      operationId: listRoles
      tags:
        - RBAC Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/permissions:
    get:
      summary: List all permissions
      description: Get a list of all available permissions (platform admin only)
      operationId: listPermissions
      tags:
        - RBAC Management
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of permissions
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/user-roles:
    get:
      summary: Get user roles
      description: Get all roles for a specific user (platform admin only)
      operationId: getUserRoles
      tags:
        - RBAC Management
      security:
        - bearerAuth: []
      parameters:
        - name: user_did
          in: query
          description: User DID to get roles for
          required: true
          schema:
            type: string
        - name: subforum_id
          in: query
          description: Filter roles by subforum ID
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User roles
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_did:
                    type: string
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserRole'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/admin/assign-role:
    post:
      summary: Assign role to user
      description: Assign a role to a user (platform admin only)
      operationId: assignRole
      tags:
        - RBAC Management
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
