info:
  contact:
    email: matt@hashpost.dev
    name: Matt Ouille
    url: https://github.com/matt0x6f
  description: HashPost is a modern forum platform with enhanced security and privacy features.
  title: HashPost API
  version: 1.0.0
openapi: 3.1.0
paths:
  /auth/deactivate-pseudonym:
    post:
      description: Deactivates a pseudonym owned by the current user. Deactivated pseudonyms cannot be reactivated.
      operationId: deactivate-pseudonym
      parameters:
        - description: Bearer token for API authentication
          in: header
          name: Authorization
          schema:
            description: Bearer token for API authentication
            type: string
        - description: JWT access token from cookie
          in: cookie
          name: access_token
          schema:
            description: JWT access token from cookie
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeactivatePseudonymBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeactivatePseudonymResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - jwt: []
      summary: Deactivate pseudonym
      tags:
        - Authentication
  /auth/login:
    post:
      description: Authenticates a user and returns access tokens with role-based capabilities. The client should set HTTP-only cookies based on the returned tokens.
      operationId: login-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLoginBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserLoginResponseBody"
          description: OK
          headers:
            Domain:
              schema:
                type: string
            Expires:
              schema:
                type: string
            HttpOnly:
              schema:
                type: boolean
            MaxAge:
              schema:
                format: int64
                type: integer
            Name:
              schema:
                type: string
            Partitioned:
              schema:
                type: boolean
            Path:
              schema:
                type: string
            Quoted:
              schema:
                type: boolean
            Raw:
              schema:
                type: string
            RawExpires:
              schema:
                type: string
            SameSite:
              schema:
                format: int64
                type: integer
            Secure:
              schema:
                type: boolean
            Set-Cookie:
              schema:
                type: string
            Unparsed:
              schema:
                type: string
            Value:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Authenticate a user
      tags:
        - Authentication
  /auth/logout:
    post:
      description: Invalidates the user's refresh token. The client should clear any stored tokens and cookies.
      operationId: logout-user
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserLogoutBody"
        required: true
      responses:
        "204":
          description: No Content
          headers:
            Domain:
              schema:
                type: string
            Expires:
              schema:
                type: string
            HttpOnly:
              schema:
                type: boolean
            MaxAge:
              schema:
                format: int64
                type: integer
            Message:
              schema:
                examples:
                  - Logout successful
                type: string
            Name:
              schema:
                type: string
            Partitioned:
              schema:
                type: boolean
            Path:
              schema:
                type: string
            Quoted:
              schema:
                type: boolean
            Raw:
              schema:
                type: string
            RawExpires:
              schema:
                type: string
            SameSite:
              schema:
                format: int64
                type: integer
            Secure:
              schema:
                type: boolean
            Set-Cookie:
              schema:
                type: string
            Unparsed:
              schema:
                type: string
            Value:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Logout a user
      tags:
        - Authentication
  /auth/me:
    get:
      description: Retrieves the current user's session data including pseudonyms and metadata. Returns the same structure as login response.
      operationId: get-current-user-session
      parameters:
        - description: Bearer token for API authentication
          in: header
          name: Authorization
          schema:
            description: Bearer token for API authentication
            type: string
        - description: JWT access token from cookie
          in: cookie
          name: access_token
          schema:
            description: JWT access token from cookie
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserSessionResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - jwt: []
      summary: Get current user session data
      tags:
        - Authentication
  /auth/me/subforum/{subforum_name}:
    get:
      description: Retrieves the current user's session data including subforum-specific moderator capabilities and permissions.
      operationId: get-current-user-session-for-subforum
      parameters:
        - description: Bearer token for API authentication
          in: header
          name: Authorization
          schema:
            description: Bearer token for API authentication
            type: string
        - description: JWT access token from cookie
          in: cookie
          name: access_token
          schema:
            description: JWT access token from cookie
            type: string
        - in: path
          name: subforum_name
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUserSessionResponseBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      security:
        - jwt: []
      summary: Get current user session data with subforum-specific capabilities
      tags:
        - Authentication
  /auth/refresh:
    post:
      description: Refreshes an expired access token using a valid refresh token. The client should update the access token cookie with the new token.
      operationId: refresh-token
      parameters:
        - in: cookie
          name: refresh_token
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenRefreshResponseBody"
          description: OK
          headers:
            Domain:
              schema:
                type: string
            Expires:
              schema:
                type: string
            HttpOnly:
              schema:
                type: boolean
            MaxAge:
              schema:
                format: int64
                type: integer
            Name:
              schema:
                type: string
            Partitioned:
              schema:
                type: boolean
            Path:
              schema:
                type: string
            Quoted:
              schema:
                type: boolean
            Raw:
              schema:
                type: string
            RawExpires:
              schema:
                type: string
            SameSite:
              schema:
                format: int64
                type: integer
            Secure:
              schema:
                type: boolean
            Set-Cookie:
              schema:
                type: string
            Unparsed:
              schema:
                type: string
            Value:
              schema:
                type: string
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: Refresh an expired access token
      tags:
        - Authentication
  /auth/register:
