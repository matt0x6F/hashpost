version: '3.8'

services:
  hashpost-pds-test:
    build: .
    command: hashpost-pds run --config /app/config/test.yaml
    environment:
      - DATABASE_URL=postgres://hashpost:password@postgres-test:5432/hashpost_test
      - REDIS_URL=redis://redis-test:6379
      - LOG_LEVEL=error
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - hashpost-test-network

  hashpost-appview-test:
    build: .
    command: hashpost-appview run --config /app/config/test.yaml
    environment:
      - PDS_URL=http://hashpost-pds-test:8080
      - LOG_LEVEL=error
    depends_on:
      - hashpost-pds-test
    networks:
      - hashpost-test-network

  postgres-test:
    image: postgres:15
    environment:
      - POSTGRES_DB=hashpost_test
      - POSTGRES_USER=hashpost
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hashpost -d hashpost_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hashpost-test-network

  redis-test:
    image: redis:7-alpine
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - hashpost-test-network

volumes:
  postgres_test_data:
  redis_test_data:

networks:
  hashpost-test-network:
    driver: bridge
